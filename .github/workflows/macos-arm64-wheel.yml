name: macOS ARM64 wheel

on:
  push:
    branches: [main, macos-arm64, 'macos-*']
    paths:
      - '.github/workflows/macos-arm64-wheel.yml'
      - 'config/**'
      - 'native/**'
      - 'python/**'
      - 'src/**'
      - 'tools/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'NOTICE'
  pull_request:
    paths:
      - '.github/workflows/macos-arm64-wheel.yml'
      - 'config/**'
      - 'native/**'
      - 'python/**'
      - 'src/**'
      - 'tools/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-wheel-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  RUSTUP_TOOLCHAIN: '1.99.1'
  CARGO_BUILD_JOBS: '2'
  MACH_TELEMETRY_NO_SUBMIT: '1'

jobs:
  build:
    # xcode-27 is the published macOS 27 ARM64 preview label, not macos-latest.
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
          architecture: arm64
      - name: Install build tools
        run: |
          brew install llvm lld pkgconf nss openssl@3
          rustup toolchain install 1.99.1 --profile minimal
      - name: Check architecture, SDK and pinned OpenSSL
        run: python -B tools/ci_macos.py preflight
      - name: Cache verified download archives only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/downloads
          key: macos-arm64-downloads-${{ hashFiles('config/*lock.json') }}
      - name: Build and test SpiderMonkey from source
        run: python -B tools/ci_macos.py engine --jobs 2
      - name: Generate platform data and capture pinned Firefox baseline
        run: python -B tools/ci_macos.py inputs --jobs 2
      - name: Build complete product and Neqo runtime
        run: python -B tools/ci_macos.py product --jobs 2
      - name: Run runtime and local network regressions
        run: python -B tools/ci_macos.py verify
      - name: Bundle standalone Python and native libraries into wheel
        run: python -B tools/ci_macos.py wheel
      - name: Export wheel and QUIC integration peer
        run: python -B tools/ci_macos.py export
      - name: Upload installation inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64-installation-inputs
          path: artifacts/macos-arm64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64-build-evidence
          path: |
            build/macos-arm64/*.json
            build/macos-arm64/logs/
            build/macos-arm64/runtime-objects/*.log
          if-no-files-found: warn
          retention-days: 14

  install:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
          architecture: arm64
      - name: Install certificate fixture tools (not client dependencies)
        run: brew install nss
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64-installation-inputs
          path: artifacts/macos-arm64/
      - name: Offline install and test on a fresh VM
        run: python -B tools/verify_macos_wheel.py --artifact-dir artifacts/macos-arm64 --require-clean-checkout
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64-installation-evidence
          path: |
            build/macos-arm64/wheel-verification.json
            build/macos-arm64/logs/
          if-no-files-found: warn
          retention-days: 14
